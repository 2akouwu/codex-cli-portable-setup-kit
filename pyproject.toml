[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reverify"
version = "0.4.2"
description = "Verified reverse engineering: AI RE grounded on deterministic tools — claims checked against the binary, not hallucinated."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "2akouwu" }]
keywords = [
    "reverse-engineering", "binary-analysis", "disassembler", "frida",
    "protobuf", "mcp", "ai-agents", "malware-analysis", "ctf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
# Mature engines. The pure-Python core always works; these upgrade it in place.
capstone = ["capstone>=5.0"]   # full-fidelity disassembly (x86/x64/ARM/ARM64)
unicorn = ["unicorn>=2.0"]     # real CPU emulation
lief = ["lief>=0.14"]          # PE / ELF / Mach-O parsing
full = ["capstone>=5.0", "unicorn>=2.0", "lief>=0.14"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/2akouwu/reverify"
Repository = "https://github.com/2akouwu/reverify"
Issues = "https://github.com/2akouwu/reverify/issues"

[project.scripts]
reverify = "reverify.cli:main"
reverify-mcp = "reverify.mcp_server:run_mcp_server"

[tool.setuptools]
packages = ["reverify"]

[tool.setuptools.package-data]
reverify = ["py.typed"]
